###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = alacritty -e yazi
$menu = wofi
$browser = prime-run qutebrowser
$music = youtube-music --enable-features=UseOzonePlatform --ozone-platform=wayland

$scriptfolder=$HOME/scripts

################
### IMPORTS  ###
################

source = ~/.config/hypr/exec.conf
source = ~/.config/hypr/decor.conf
source = ~/.config/hypr/binds.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,preferred,auto,1.33
monitor=HDMI-A-1,preferred,auto-center-left,1.6

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# enable nvidia card
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = TERM,alacritty

###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow



# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

binds {
    movefocus_cycles_fullscreen = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,sk
    kb_variant = colemak_dh,qwerty
    kb_model =
    kb_options = caps:backspace,grp:win_space_toggle,grp:rctrl_switch
    kb_rules =

    follow_mouse = 1
    numlock_by_default = true
    resolve_binds_by_sym = true

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hypr.land/Configuring/Keywords#per-device-input-configs
device {
  name = idank-sweeq-keyboard
  kb_layout = us,sk
  kb_variant = ,qwerty
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

workspace = 1, defaultName:browser, on-created-empty:$browser, monitor:1, persistent:true
workspace = 2, defaultName:code, on-created-empty:$scriptfolder/zellij-hook, monitor:0, persistent:true
workspace = 3, defaultName:writing, monitor:1, persistent:true
workspace = 4, defaultName:misc, monitor:0, persistent:true
workspace = 5, defaultName:music, monitor:0, persistent:true

# windowrule = workspace 1, class:org.qutebrowser.qutebrowser

windowrule = workspace 3, class:et
windowrule = workspace 3, class:wps
windowrule = workspace 3, class:wpp
windowrule = workspace 3, class:org.pwmt.zathura
windowrule = workspace 3, class:codium

windowrule = workspace 4, class:KeePassXC
windowrule = workspace 4, class:calibre-gui

windowrule = workspace 5, class:com.github.th_ch.youtube_music

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Make terminals with this keyword floating
windowrule = float,initialClass:^floatterm$
windowrule = center,initialClass:^floatterm$
windowrule = size 80% 80%,initialClass:^floatterm$

##############################
###        PLUGINS         ###
##############################
plugin {
    virtual-desktops {
    }
}


##############################
###         MISC           ###
##############################

# disable scaling to prevent pixelation
xwayland {
    force_zero_scaling = true
}
