#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

# auth
exec-once = systemctl --user start hyprpolkitagent &
# automount
exec-once = udiskie &
# sync
exec-once = syncthing --no-browser &
# blue light filter
exec-once = $scriptfolder/nightlight -s
# taskbar
exec-once = waybar &
# wallpaper
exec-once = awww-daemon && bash -c 'awww img "$(cat ~/.cache/wal/wal)"'
# windows
exec-once = [workspace code]ghostty -e $scriptfolder/zellij-hook
