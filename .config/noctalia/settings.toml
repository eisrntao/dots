[widget.battery]
hide_when_full = true
hide_when_plugged = true

[widget.control-center]
glyph = "blocks"

[widget.media]
artist_first = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.spacer_2]
type = "spacer"

[widget.workspaces]
enabled = false
focused_output_only = true
labels_only_when_occupied = true
style = "focus_hint"
