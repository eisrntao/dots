[bar]
order = [ "default", "secondary", "ribbon" ]

    [bar.default]
    background_opacity = 0.0
    center = [ "group:g1" ]
    end = [ "group:g2" ]
    margin_ends = 0
    position = "top"
    shadow = false
    start = [ "group:g3", "spacer_2", "media" ]

    [bar.default.dead_zone.actions]
    middle = "settings-open"
    scroll_down = "workspace-switch next"
    scroll_up = "workspace-switch prev"

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "status_bar_2", "clock", "notifications" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "tray", "network", "bluetooth", "volume", "battery" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "control-center", "settings", "session" ]
        opacity = 0.0
        padding = 6.0

        [bar.default.monitor.eDP-1]
        background_opacity = 1.0
        center = [ "notifications", "status_bar_2", "clock", "media" ]
        end = [ "group:g1" ]
        margin_ends = 705
        position = "top"
        reserve_space = false
        scale = 0.95000000670552254
        smart_auto_hide = false
        start = []
        thickness = 24

            [[bar.default.monitor.eDP-1.capsule_group]]
            accordion = false
            accordion_direction = "end"
            enabled = false
            fill = "surface_variant"
            id = "g1"
            members = [ "tray", "network", "bluetooth", "volume", "battery" ]
            opacity = 1.0
            padding = 6.0

    [bar.ribbon]
    background_opacity = 0.0
    center = [ "ribbon" ]
    enabled = true
    end = []
    margin_edge = 1
    padding = 10
    position = "bottom"
    reserve_space = false
    start = []
    thickness = 10

    [bar.secondary]
    center = []
    enabled = true
    end = [ "group:g1" ]
    margin_ends = 350
    padding = 12
    position = "right"
    reserve_space = false
    scale = 0.95000000670552254
    start = [ "tray", "status", "workspaces" ]
    thickness = 22

        [bar.secondary.monitor.HDMI-A-1]
        enabled = false

        [[bar.secondary.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "network", "bluetooth", "volume", "battery" ]
        opacity = 0.0
        padding = 6.0

